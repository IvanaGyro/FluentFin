name: 'Build cache'
description: >
  Restores the NuGet packages and obj folders of the newest earlier build of this branch, or of master when the branch
  has none yet, and back-dates every file identical to that build so msbuild skips projects whose inputs did not change.
  Saves a new cache for the branch when the job succeeds. Run it right after checkout.
  Master's caches are made by test-build.yml (app, master-build) and master-tests-cache.yml (Core tests, master-tests).

inputs:
  prefix:
    description: 'Cache name: master-build for the WinUI app, master-tests for FluentFin.Core.Tests'
    required: true
  branch:
    description: 'Branch being built, used to find and name its own caches'
    default: ${{ github.head_ref || github.ref_name }}

runs:
  using: composite
  steps:
  # restore-keys are tried in order: the branch's own latest cache first, then master's latest.
  # The key is unique per run, so every successful run saves a new cache (in this action's post step).
  - id: cache
    uses: actions/cache@v4
    with:
      key: ${{ inputs.prefix }}-branch-${{ inputs.branch }}-${{ github.run_id }}-${{ github.run_attempt }}
      restore-keys: |
        ${{ inputs.prefix }}-branch-${{ inputs.branch }}-
        ${{ inputs.prefix }}-
      path: |
        ~/.nuget/packages
        **/obj
        .build-cache-sha

  # msbuild compares file timestamps, and a fresh checkout stamps every source file with "now",
  # which would rebuild everything. Files unchanged since the cached commit get an old timestamp again.
  - if: steps.cache.outputs.cache-matched-key != ''
    shell: bash
    run: |
      base=$(cat .build-cache-sha 2>/dev/null || true)
      [ -n "$base" ] || exit 0
      git cat-file -e "$base^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$base" || { echo "cached commit unavailable, building from scratch"; exit 0; }
      git -c core.quotepath=false diff --name-only "$base" HEAD > "$RUNNER_TEMP/changed.txt" || { echo "cannot diff against $base, building from scratch"; exit 0; }
      git -c core.quotepath=false ls-files | grep -vxFf "$RUNNER_TEMP/changed.txt" | xargs -d '\n' touch -d '2000-01-01' || true
      echo "Restored ${{ steps.cache.outputs.cache-matched-key }}; $(wc -l < "$RUNNER_TEMP/changed.txt") files differ from cached build $base"

  # the commit this job builds; saved with the cache. A pull request builds a merge commit that cannot be fetched later, so use its head.
  - shell: bash
    run: echo "${{ github.event.pull_request.head.sha || github.sha }}" > .build-cache-sha
