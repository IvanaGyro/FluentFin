name: "Test build (fork only)"

# Builds both architectures and the installers from any ref and uploads them as artifacts.
# Never publishes a release. Lives on the fork's default branch only (workflow_dispatch needs that).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build'
        required: true
      nuget-cache:
        description: 'Restore NuGet packages from the cache (untick to download them, e.g. to compare speeds)'
        type: boolean
        default: true

env:
  MAIN_PROJECT_PATH: 'FluentFin\FluentFin.csproj'
  PUBLISH_FOLDER: 'FluentFin\bin\publish'
  PUBLISH_FOLDER_ARM64: 'FluentFin\bin\publish-arm64'
  FFMPEG_ARM64_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-winarm64-gpl-shared.zip
  CTK_LABS_INDEX: https://pkgs.dev.azure.com/dotnet/CommunityToolkit/_packaging/CommunityToolkit-Labs/nuget/v3/index.json
  # NuGet packages on the runner's D: drive (where the workspace is): extracting the NuGet cache to C: is much slower
  NUGET_PACKAGES: 'D:\nuget-packages'

jobs:
  # Cheap check on a Linux runner: is master's current commit already in the build cache?
  master-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      cached: ${{ steps.check.outputs.cached }}
    steps:
    - id: check
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        sha=$(gh api "repos/$GH_REPO/commits/master" --jq .sha)
        n=$(gh cache list --ref "$GITHUB_REF" --key "build-master-$sha" --json key --jq length)
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
        echo "cached=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        echo "master $sha cached: $n"

  # Only when master moved: build it (both architectures, same commands as the build job) and save its obj folders,
  # which builds of refs without a cache of their own start from.
  master-build:
    needs: master-check
    if: needs.master-check.outputs.cached != 'true'
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.master-check.outputs.sha }}

    - id: nuget
      uses: actions/cache/restore@v4
      with:
        key: nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: nuget-
        path: D:\nuget-packages

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0'

    - uses: microsoft/setup-msbuild@v2

    - run: dotnet nuget add source ${{ env.CTK_LABS_INDEX }} -n CommunityToolkitLabs

    - run: dotnet publish ${{ env.MAIN_PROJECT_PATH }} --self-contained -c Release -r win-x64 -p:Platform=x64 -o ${{ runner.temp }}\publish\ /property:BuildVersion=0.0.1

    - name: Download arm64 FFmpeg
      shell: pwsh
      run: |
        Invoke-WebRequest $env:FFMPEG_ARM64_URL -OutFile ffmpeg-arm64.zip
        Expand-Archive ffmpeg-arm64.zip -DestinationPath ffmpeg-arm64
        New-Item -ItemType Directory -Force FluentFin\FFMpeg-arm64 | Out-Null
        foreach ($x64 in Get-ChildItem FluentFin\FFMpeg\*.dll) {
          $match = Get-ChildItem ffmpeg-arm64 -Recurse -Filter $x64.Name | Select-Object -First 1
          if (-not $match) { throw "arm64 FFmpeg is missing $($x64.Name)" }
          Copy-Item $match.FullName FluentFin\FFMpeg-arm64\
        }

    - run: dotnet publish ${{ env.MAIN_PROJECT_PATH }} --self-contained -c Release -r win-arm64 -p:Platform=arm64 -o ${{ runner.temp }}\publish-arm64\ /property:BuildVersion=0.0.1

    - shell: bash
      run: echo "${{ needs.master-check.outputs.sha }}" > .build-cache-sha

    - uses: actions/cache/save@v4
      with:
        key: build-master-${{ needs.master-check.outputs.sha }}
        path: |
          **/obj
          .build-cache-sha

    - if: steps.nuget.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        key: nuget-${{ hashFiles('**/*.csproj') }}
        path: D:\nuget-packages

  build:
    needs: [master-check, master-build]
    # runs when master-build was skipped (master already cached), not when it failed
    if: ${{ !failure() && !cancelled() }}
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}

    # NuGet packages are cached on their own, keyed on the project files, and saved only when those change
    - id: nuget
      if: inputs.nuget-cache
      uses: actions/cache/restore@v4
      with:
        key: nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: nuget-
        path: D:\nuget-packages

    # obj folders of the newest earlier build of this ref, else of master's latest build
    - id: obj
      uses: actions/cache/restore@v4
      with:
        key: build-ref-${{ inputs.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          build-ref-${{ inputs.ref }}-
          build-master-
        path: |
          **/obj
          .build-cache-sha

    # msbuild compares file timestamps and a fresh checkout stamps every file "now", which would rebuild everything.
    # Files unchanged since the cached build get an old timestamp again, so only projects with changes are recompiled.
    - id: stamps
      if: steps.obj.outputs.cache-matched-key != ''
      shell: bash
      run: |
        base=$(cat .build-cache-sha 2>/dev/null || true)
        [ -n "$base" ] || exit 0
        echo "base=$base" >> "$GITHUB_OUTPUT"
        git cat-file -e "$base^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$base" || { echo "cached commit unavailable, building from scratch"; exit 0; }
        git -c core.quotepath=false diff --name-only "$base" HEAD > "$RUNNER_TEMP/changed.txt" || exit 0
        git -c core.quotepath=false ls-files | grep -vxFf "$RUNNER_TEMP/changed.txt" | xargs -d '\n' touch -d '2000-01-01' || true
        echo "Restored ${{ steps.obj.outputs.cache-matched-key }}; $(wc -l < "$RUNNER_TEMP/changed.txt") files differ from cached build $base"

    - id: head
      shell: bash
      run: |
        git rev-parse HEAD > .build-cache-sha
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0'

    - uses: microsoft/setup-msbuild@v2

    - name: Add Windows Community Toolkit labs nuget source
      run: dotnet nuget add source ${{ env.CTK_LABS_INDEX }} -n CommunityToolkitLabs

    # Its own step so the time spent getting packages (from the cache, else downloaded) shows up separately;
    # the restores inside the publish steps below then only re-check them.
    - name: Restore packages
      shell: pwsh
      run: |
        dotnet restore ${{ env.MAIN_PROJECT_PATH }} -r win-x64 -p:Platform=x64
        if ($LASTEXITCODE) { throw "restore failed" }
        if (Select-String -Path FluentFin\FluentFin.csproj -Pattern 'win-arm64' -Quiet) {
          dotnet restore ${{ env.MAIN_PROJECT_PATH }} -r win-arm64 -p:Platform=arm64
          if ($LASTEXITCODE) { throw "restore failed" }
        }

    # refs created before the ARM64 work (no win-arm64 handling in the csproj) are built for x64 only
    - name: Detect arm64 support
      id: arm
      shell: pwsh
      run: |
        $ok = (Select-String -Path FluentFin\FluentFin.csproj -Pattern 'win-arm64' -Quiet) -and (Select-String -Path Installer\script.iss -Pattern 'Arch' -Quiet)
        "supported=$($ok.ToString().ToLower())" >> $env:GITHUB_OUTPUT

    - name: Build x64
      run: dotnet publish ${{ env.MAIN_PROJECT_PATH }} --self-contained -c Release -r win-x64 -p:Platform=x64 -o ${{ env.PUBLISH_FOLDER }}\ /property:BuildVersion=0.0.1

    - name: Download arm64 FFmpeg
      if: steps.arm.outputs.supported == 'true'
      shell: pwsh
      run: |
        Invoke-WebRequest $env:FFMPEG_ARM64_URL -OutFile ffmpeg-arm64.zip
        Expand-Archive ffmpeg-arm64.zip -DestinationPath ffmpeg-arm64
        New-Item -ItemType Directory -Force FluentFin\FFMpeg-arm64 | Out-Null
        foreach ($x64 in Get-ChildItem FluentFin\FFMpeg\*.dll) {
          $match = Get-ChildItem ffmpeg-arm64 -Recurse -Filter $x64.Name | Select-Object -First 1
          if (-not $match) { throw "arm64 FFmpeg is missing $($x64.Name)" }
          Copy-Item $match.FullName FluentFin\FFMpeg-arm64\
        }

    - name: Build arm64
      if: steps.arm.outputs.supported == 'true'
      run: dotnet publish ${{ env.MAIN_PROJECT_PATH }} --self-contained -c Release -r win-arm64 -p:Platform=arm64 -o ${{ env.PUBLISH_FOLDER_ARM64 }}\ /property:BuildVersion=0.0.1

    - name: Installer x64
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.5
      with:
        path: Installer\script.iss
        options: /O+

    - name: Installer arm64
      if: steps.arm.outputs.supported == 'true'
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.5
      with:
        path: Installer\script.iss
        options: /O+ /DArch=arm64

    # The previous archives are updated instead of rebuilt: 7z only recompresses the solid blocks (64 MB each) holding
    # files whose size or time changed, and drops files that are gone. Runtime libraries keep their timestamps (they come
    # from the cached NuGet packages), so mostly the app's own files are recompressed.
    - name: Restore previous archives
      uses: actions/cache/restore@v4
      with:
        key: archives-ref-${{ inputs.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          archives-ref-${{ inputs.ref }}-
          archives-
        path: compressed

    # actions/upload-artifact only zips (deflate); 7z (LZMA2, solid) makes the publish folders much smaller. The installers
    # are already LZMA compressed by Inno Setup, so they stay as they are. The artifact zip only stores the .7z (compression-level 0).
    - name: Compress with 7z
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force compressed | Out-Null
        # -up0q0r2x2y2z1w2: synchronize the archive with the folder (add new, replace changed, delete missing)
        $opts = '-t7z', '-mx=9', '-md=64m', '-ms=64m', '-mqs', '-up0q0r2x2y2z1w2'
        7z u @opts compressed\FluentFin-win-x64-publish.7z ".\${{ env.PUBLISH_FOLDER }}\*"
        if ($LASTEXITCODE) { throw "7z failed" }
        if ('${{ steps.arm.outputs.supported }}' -eq 'true') {
          7z u @opts compressed\FluentFin-win-arm64-publish.7z ".\${{ env.PUBLISH_FOLDER_ARM64 }}\*"
          if ($LASTEXITCODE) { throw "7z failed" }
        } else {
          Remove-Item -ErrorAction Ignore compressed\FluentFin-win-arm64-publish.7z
        }
        Get-ChildItem compressed | Format-Table Name, Length

    - name: Upload installers
      id: up1
      uses: actions/upload-artifact@v4
      with:
        name: FluentFin-installers
        path: Installer\Output\*.exe
        retention-days: 7

    - name: Upload x64 publish
      id: up2
      uses: actions/upload-artifact@v4
      with:
        name: FluentFin-win-x64-publish
        path: compressed\FluentFin-win-x64-publish.7z
        compression-level: 0
        retention-days: 7

    - name: Upload arm64 publish
      if: steps.arm.outputs.supported == 'true'
      id: up3
      uses: actions/upload-artifact@v4
      with:
        name: FluentFin-win-arm64-publish
        path: compressed\FluentFin-win-arm64-publish.7z
        compression-level: 0
        retention-days: 7

    - name: Artifact links
      shell: bash
      run: |
        {
          echo "### Artifacts for \`${{ inputs.ref }}\`"
          echo "- [installers](${{ steps.up1.outputs.artifact-url }})"
          echo "- [x64 publish](${{ steps.up2.outputs.artifact-url }})"
          if [ "${{ steps.arm.outputs.supported }}" = true ]; then
            echo "- [arm64 publish](${{ steps.up3.outputs.artifact-url }})"
          else
            echo "- arm64 skipped: this ref has no arm64 support"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    # skipped when this exact commit was already the cached one: nothing new to store
    - if: steps.stamps.outputs.base != steps.head.outputs.sha
      uses: actions/cache/save@v4
      with:
        key: build-ref-${{ inputs.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          **/obj
          .build-cache-sha

    - uses: actions/cache/save@v4
      with:
        key: archives-ref-${{ inputs.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: compressed

    - if: inputs.nuget-cache && steps.nuget.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        key: nuget-${{ hashFiles('**/*.csproj') }}
        path: D:\nuget-packages
