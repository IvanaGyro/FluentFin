name: "Test build (fork only)"

# Builds both architectures and the installers from any ref and uploads them as artifacts.
# Never publishes a release. Lives on the fork's default branch only (workflow_dispatch needs that).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build'
        required: true

env:
  MAIN_PROJECT_PATH: 'FluentFin\FluentFin.csproj'
  PUBLISH_FOLDER: 'FluentFin\bin\publish'
  PUBLISH_FOLDER_ARM64: 'FluentFin\bin\publish-arm64'
  FFMPEG_ARM64_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-winarm64-gpl-shared.zip
  CTK_LABS_INDEX: https://pkgs.dev.azure.com/dotnet/CommunityToolkit/_packaging/CommunityToolkit-Labs/nuget/v3/index.json

jobs:
  # Keeps master's build cache current: when master has a commit that is not cached yet, build it and save the
  # NuGet packages and obj folders, which the build job (through .github/actions/build-cache) starts from.
  master-cache:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: master

    - id: sha
      shell: bash
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    # only checks whether this master commit is cached, nothing is downloaded
    - id: cache
      uses: actions/cache/restore@v4
      with:
        key: master-build-${{ steps.sha.outputs.sha }}
        lookup-only: true
        path: .build-cache-sha

    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0'

    - if: steps.cache.outputs.cache-hit != 'true'
      uses: microsoft/setup-msbuild@v2

    - if: steps.cache.outputs.cache-hit != 'true'
      run: dotnet nuget add source ${{ env.CTK_LABS_INDEX }} -n CommunityToolkitLabs

    # same command (configuration, runtime, platform) as the Build x64 step, so the obj folders match
    - if: steps.cache.outputs.cache-hit != 'true'
      run: dotnet publish ${{ env.MAIN_PROJECT_PATH }} --self-contained -c Release -r win-x64 -p:Platform=x64 -o ${{ runner.temp }}\master-publish\ /property:BuildVersion=0.0.1

    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: echo "${{ steps.sha.outputs.sha }}" > .build-cache-sha

    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        key: master-build-${{ steps.sha.outputs.sha }}
        path: |
          ~/.nuget/packages
          **/obj
          .build-cache-sha

  build:
    needs: master-cache
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}

    # Start from the newest cache of this ref, else master's (made by the master-cache job). The cache is saved when the
    # job succeeds, so the next build of the same ref starts from this one.
    - id: cache
      uses: actions/cache@v4
      with:
        key: master-build-branch-${{ inputs.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          master-build-branch-${{ inputs.ref }}-
          master-build-
        path: |
          ~/.nuget/packages
          **/obj
          .build-cache-sha

    # msbuild compares file timestamps and a fresh checkout stamps every file "now", which would rebuild everything.
    # Files unchanged since the cached build get an old timestamp again.
    - if: steps.cache.outputs.cache-matched-key != ''
      shell: bash
      run: |
        base=$(cat .build-cache-sha 2>/dev/null || true)
        [ -n "$base" ] || exit 0
        git cat-file -e "$base^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$base" || { echo "cached commit unavailable, building from scratch"; exit 0; }
        git -c core.quotepath=false diff --name-only "$base" HEAD > "$RUNNER_TEMP/changed.txt" || exit 0
        git -c core.quotepath=false ls-files | grep -vxFf "$RUNNER_TEMP/changed.txt" | xargs -d '\n' touch -d '2000-01-01' || true
        echo "Restored ${{ steps.cache.outputs.cache-matched-key }}; $(wc -l < "$RUNNER_TEMP/changed.txt") files differ from cached build $base"

    - shell: bash
      run: git rev-parse HEAD > .build-cache-sha

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0'

    - uses: microsoft/setup-msbuild@v2

    - name: Add Windows Community Toolkit labs nuget source
      run: dotnet nuget add source ${{ env.CTK_LABS_INDEX }} -n CommunityToolkitLabs

    # refs created before the ARM64 work (no win-arm64 handling in the csproj) are built for x64 only
    - name: Detect arm64 support
      id: arm
      shell: pwsh
      run: |
        $ok = (Select-String -Path FluentFin\FluentFin.csproj -Pattern 'win-arm64' -Quiet) -and (Select-String -Path Installer\script.iss -Pattern 'Arch' -Quiet)
        "supported=$($ok.ToString().ToLower())" >> $env:GITHUB_OUTPUT

    - name: Build x64
      run: dotnet publish ${{ env.MAIN_PROJECT_PATH }} --self-contained -c Release -r win-x64 -p:Platform=x64 -o ${{ env.PUBLISH_FOLDER }}\ /property:BuildVersion=0.0.1

    - name: Download arm64 FFmpeg
      if: steps.arm.outputs.supported == 'true'
      shell: pwsh
      run: |
        Invoke-WebRequest $env:FFMPEG_ARM64_URL -OutFile ffmpeg-arm64.zip
        Expand-Archive ffmpeg-arm64.zip -DestinationPath ffmpeg-arm64
        New-Item -ItemType Directory -Force FluentFin\FFMpeg-arm64 | Out-Null
        foreach ($x64 in Get-ChildItem FluentFin\FFMpeg\*.dll) {
          $match = Get-ChildItem ffmpeg-arm64 -Recurse -Filter $x64.Name | Select-Object -First 1
          if (-not $match) { throw "arm64 FFmpeg is missing $($x64.Name)" }
          Copy-Item $match.FullName FluentFin\FFMpeg-arm64\
        }

    - name: Build arm64
      if: steps.arm.outputs.supported == 'true'
      run: dotnet publish ${{ env.MAIN_PROJECT_PATH }} --self-contained -c Release -r win-arm64 -p:Platform=arm64 -o ${{ env.PUBLISH_FOLDER_ARM64 }}\ /property:BuildVersion=0.0.1

    - name: Installer x64
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.5
      with:
        path: Installer\script.iss
        options: /O+

    - name: Installer arm64
      if: steps.arm.outputs.supported == 'true'
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.5
      with:
        path: Installer\script.iss
        options: /O+ /DArch=arm64

    - name: Upload installers
      id: up1
      uses: actions/upload-artifact@v4
      with:
        name: FluentFin-installers
        path: Installer\Output\*.exe
        retention-days: 7

    - name: Upload x64 publish
      id: up2
      uses: actions/upload-artifact@v4
      with:
        name: FluentFin-win-x64-publish
        path: ${{ env.PUBLISH_FOLDER }}
        retention-days: 7

    - name: Upload arm64 publish
      if: steps.arm.outputs.supported == 'true'
      id: up3
      uses: actions/upload-artifact@v4
      with:
        name: FluentFin-win-arm64-publish
        path: ${{ env.PUBLISH_FOLDER_ARM64 }}
        retention-days: 7

    - name: Artifact links
      shell: bash
      run: |
        {
          echo "### Artifacts for \`${{ inputs.ref }}\`"
          echo "- [installers](${{ steps.up1.outputs.artifact-url }})"
          echo "- [x64 publish](${{ steps.up2.outputs.artifact-url }})"
          if [ "${{ steps.arm.outputs.supported }}" = true ]; then
            echo "- [arm64 publish](${{ steps.up3.outputs.artifact-url }})"
          else
            echo "- arm64 skipped: this ref has no arm64 support"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
