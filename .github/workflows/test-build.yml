name: "Test build (fork only)"

# Builds both architectures and the installers from any ref and uploads them as artifacts.
# Never publishes a release. Lives on the fork's default branch only (workflow_dispatch needs that).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build'
        required: true

env:
  MAIN_PROJECT_PATH: 'FluentFin\FluentFin.csproj'
  PUBLISH_FOLDER: 'FluentFin\bin\publish'
  PUBLISH_FOLDER_ARM64: 'FluentFin\bin\publish-arm64'
  FFMPEG_ARM64_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-winarm64-gpl-shared.zip
  CTK_LABS_INDEX: https://pkgs.dev.azure.com/dotnet/CommunityToolkit/_packaging/CommunityToolkit-Labs/nuget/v3/index.json

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0'

    - uses: microsoft/setup-msbuild@v2

    - name: Add Windows Community Toolkit labs nuget source
      run: dotnet nuget add source ${{ env.CTK_LABS_INDEX }} -n CommunityToolkitLabs

    - name: Build x64
      run: dotnet publish ${{ env.MAIN_PROJECT_PATH }} --self-contained -c Release -r win-x64 -p:Platform=x64 -o ${{ env.PUBLISH_FOLDER }}\ /property:BuildVersion=0.0.1

    # skipped automatically if the ref has no arm64 support (no FFMpeg-arm64 handling in the csproj)
    - name: Download arm64 FFmpeg
      shell: pwsh
      run: |
        Invoke-WebRequest $env:FFMPEG_ARM64_URL -OutFile ffmpeg-arm64.zip
        Expand-Archive ffmpeg-arm64.zip -DestinationPath ffmpeg-arm64
        New-Item -ItemType Directory -Force FluentFin\FFMpeg-arm64 | Out-Null
        foreach ($x64 in Get-ChildItem FluentFin\FFMpeg\*.dll) {
          $match = Get-ChildItem ffmpeg-arm64 -Recurse -Filter $x64.Name | Select-Object -First 1
          if (-not $match) { throw "arm64 FFmpeg is missing $($x64.Name)" }
          Copy-Item $match.FullName FluentFin\FFMpeg-arm64\
        }

    - name: Build arm64
      run: dotnet publish ${{ env.MAIN_PROJECT_PATH }} --self-contained -c Release -r win-arm64 -p:Platform=arm64 -o ${{ env.PUBLISH_FOLDER_ARM64 }}\ /property:BuildVersion=0.0.1

    - name: Installer x64
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.5
      with:
        path: Installer\script.iss
        options: /O+

    - name: Installer arm64
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.5
      with:
        path: Installer\script.iss
        options: /O+ /DArch=arm64

    - name: Upload installers
      id: up1
      uses: actions/upload-artifact@v4
      with:
        name: FluentFin-installers
        path: Installer\Output\*.exe
        retention-days: 7

    - name: Upload x64 publish
      id: up2
      uses: actions/upload-artifact@v4
      with:
        name: FluentFin-win-x64-publish
        path: ${{ env.PUBLISH_FOLDER }}
        retention-days: 7

    - name: Upload arm64 publish
      id: up3
      uses: actions/upload-artifact@v4
      with:
        name: FluentFin-win-arm64-publish
        path: ${{ env.PUBLISH_FOLDER_ARM64 }}
        retention-days: 7

    - name: Artifact links
      shell: bash
      run: |
        {
          echo "### Artifacts for \`${{ inputs.ref }}\`"
          echo "- [installers](${{ steps.up1.outputs.artifact-url }})"
          echo "- [x64 publish](${{ steps.up2.outputs.artifact-url }})"
          echo "- [arm64 publish](${{ steps.up3.outputs.artifact-url }})"
        } >> "$GITHUB_STEP_SUMMARY"
