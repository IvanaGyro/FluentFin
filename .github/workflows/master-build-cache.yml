name: "Master build cache"

# Builds master and saves the NuGet packages and obj folders, so branch builds (tests.yml, test-build.yml, via
# .github/actions/build-cache) start from master and only rebuild what they changed. A new cache is made whenever
# master has a commit that is not cached yet. The push run fills master's own cache scope (read by pull requests
# targeting master); the scheduled and manual runs execute on the default branch, so they fill the scope that
# workflow_dispatch builds of other refs read.
on:
  push:
    branches: [master]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

env:
  MAIN_PROJECT_PATH: 'FluentFin\FluentFin.csproj'
  CTK_LABS_INDEX: https://pkgs.dev.azure.com/dotnet/CommunityToolkit/_packaging/CommunityToolkit-Labs/nuget/v3/index.json

jobs:
  app:
    name: 'App build cache'
    runs-on: windows-latest
    steps:
    -   uses: actions/checkout@v4
        with:
          ref: master

    -   id: sha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    # only checks whether this master commit is cached, nothing is downloaded
    -   id: cache
        uses: actions/cache/restore@v4
        with:
          key: master-build-${{ steps.sha.outputs.sha }}
          lookup-only: true
          path: .build-cache-sha

    -   if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'

    -   if: steps.cache.outputs.cache-hit != 'true'
        uses: microsoft/setup-msbuild@v2

    -   if: steps.cache.outputs.cache-hit != 'true'
        run: dotnet nuget add source ${{ env.CTK_LABS_INDEX }} -n CommunityToolkitLabs

    # same command (configuration, runtime, platform) as the branch builds, so the obj folders match
    -   if: steps.cache.outputs.cache-hit != 'true'
        run: dotnet publish ${{ env.MAIN_PROJECT_PATH }} --self-contained -c Release -r win-x64 -p:Platform=x64 -o ${{ runner.temp }}\publish /property:BuildVersion=0.0.1

    -   if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: echo "${{ steps.sha.outputs.sha }}" > .build-cache-sha

    -   if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: master-build-${{ steps.sha.outputs.sha }}
          path: |
            ~/.nuget/packages
            **/obj
            .build-cache-sha

  tests:
    name: 'Tests build cache'
    runs-on: ubuntu-latest
    steps:
    -   uses: actions/checkout@v4
        with:
          ref: master

    -   id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    -   id: cache
        uses: actions/cache/restore@v4
        with:
          key: master-tests-${{ steps.sha.outputs.sha }}
          lookup-only: true
          path: .build-cache-sha

    -   if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'

    # same command as tests.yml
    -   if: steps.cache.outputs.cache-hit != 'true'
        run: dotnet test FluentFin.Core.Tests/FluentFin.Core.Tests.csproj

    -   if: steps.cache.outputs.cache-hit != 'true'
        run: echo "${{ steps.sha.outputs.sha }}" > .build-cache-sha

    -   if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: master-tests-${{ steps.sha.outputs.sha }}
          path: |
            ~/.nuget/packages
            **/obj
            .build-cache-sha
