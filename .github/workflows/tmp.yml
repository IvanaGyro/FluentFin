name: tmp build check
on: push
env:
  CTK_LABS_INDEX: https://pkgs.dev.azure.com/dotnet/CommunityToolkit/_packaging/CommunityToolkit-Labs/nuget/v3/index.json
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0' }
      - run: dotnet nuget add source ${{ env.CTK_LABS_INDEX }} -n CommunityToolkitLabs
      - run: dotnet build FluentFin\FluentFin.csproj -c Release -r win-x64
      - run: dotnet build FluentFin\FluentFin.csproj -c Release -r win-arm64
      - run: dotnet test FluentFin.Core.Tests\FluentFin.Core.Tests.csproj
